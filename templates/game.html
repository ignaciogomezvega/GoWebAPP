{{ template "base" . }}

{{define "title"}} Desafiá a MegaBot - Jugar {{end}}
{{define "content"}}

<section>
    <div class="container">
        <div class="row">
            <div class="col py-5 text-center">
                <h2>{{ .Name }}</h2>
                <p class="fw-bold" id="player_score">0</p>
                <div class="d-grid gap-2 card p-3">
                    <button class="btn custom-btn" onclick="choose(0);">
                        <img src="static/img/rock_icon_v3.png" alt="rock_icon_v3" width="50" class="img-fluid">
                        <span class="fw-bold">Piedra</span>
                    </button>
                    <button class="btn custom-btn" onclick="choose(1);">
                        <img src="static/img/paper_icon_v2.png" alt="paper_icon_v2" width="50" class="img-fluid">
                        <span class="fw-bold">Papel</span>
                    </button>
                    <button class="btn custom-btn" onclick="choose(2);">
                        <img src="static/img/scissors_icon_v2.png" alt="scissors_icon_v2" width="50" class="img-fluid">
                        <span class="fw-bold">Tijera</span>
                    </button>
                </div>
            </div>
            <div class="col py-5 text-center">
                <h2>MegaBot</h2>
                <p class="fw-bold" id="computer_score">0</p>
                <div class="card p-3">
                    <div class="d-flex justify-content-center">
                        <img src="static/img/reload_icon.png" id="img_computer" alt="reload_icon" width="200" class="img-fluid">
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<section>
    <div class="container">
        <div class="row">
            <h2>Resultados</h2>
            <ul class="list-group list-group-flush">
                <li class="list-group-item" id="player_choice">&nbsp;</li>
                <li class="list-group-item" id="computer_choice">&nbsp;</li>
                <li class="list-group-item text-danger" id="round_result">&nbsp;</li>
                <li class="list-group-item text-danger" id="message">&nbsp;</li>
            </ul>
        </div>
        <div class="row text-center">
            <div class="col py-3">
                <a href="/new" class="btn btn-success btn-lg">Nuevo Juego</a>
            </div>
        </div>
    </div>
</section>

<style>
    .custom-btn {
        border: 3px solid #2c3e50;
        color: #192487;
        background-color: transparent;
    }

    .custom-btn:hover {
        background-color: #e6f2ec;
        color: #2c3e50;
        border-color: #000000;
    }
</style>

{{end}}
